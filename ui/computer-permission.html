<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; font-family: system-ui, "Segoe UI", sans-serif; }
  body { margin: 0; padding: 16px; color: var(--viz-text, inherit); }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .text { line-height: 1.55; font-size: 14px; margin: 8px 0; overflow-wrap: anywhere; }
  .muted { opacity: .75; }
  .choices { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin-top: 18px; }
  button { font: inherit; padding: 12px 8px; border-radius: 8px; border: 1px solid #929292; cursor: pointer; background: transparent; color: inherit; }
  button:focus-visible { outline: 3px solid #397dd8; outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .permit { border-color: #2d8058; }
  #status { font-size: 13px; margin-top: 12px; }
  @media (max-width: 320px) { .choices { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h2>Junius 请求设备授权</h2>
<p class="text"><strong id="tool">正在读取授权请求…</strong></p>
<p class="text" id="purpose"></p>
<p class="text muted" id="risk"></p>
<div class="choices" role="group" aria-label="授权范围">
  <button class="permit" data-choice="允许本轮" disabled>允许本轮</button>
  <button class="permit" data-choice="允许本会话" disabled>允许本 Chat</button>
  <button data-choice="拒绝本轮" disabled>拒绝本轮</button>
  <button data-choice="拒绝本会话" disabled>拒绝本 Chat</button>
</div>
<div id="status" role="status" aria-live="polite">关闭此面板不会授予权限。</div>
<script type="module">
(() => {
  const byId = (id) => document.getElementById(id);
  const buttons = [...document.querySelectorAll("[data-choice]")];
  const status = byId("status");
  let token = null, current = null, busy = false;
  let seq = 0;
  const pending = new Map();
  const post = (message) => window.parent.postMessage(message, "*");
  function request(method, params) {
    const id = ++seq;
    post({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  window.addEventListener("message", ({ data, source }) => {
    if (source !== window.parent || !data || data.jsonrpc !== "2.0") return;
    if (data.method === "ui/notifications/tool-result") {
      show(payload(data.params));
      return;
    }
    if (data.method === "ui/resource-teardown" && data.id != null) {
      post({ jsonrpc: "2.0", id: data.id, result: {} });
      return;
    }
    if (typeof data.id !== "number") return;
    const handler = pending.get(data.id);
    if (!handler) return;
    pending.delete(data.id);
    if (data.error) handler.reject(new Error(data.error.message ?? "MCP bridge error"));
    else handler.resolve(data.result);
  });
  async function bridge() {
    await request("ui/initialize", {
      appInfo: { name: "junius-computer-permission", version: "1" },
      appCapabilities: {},
      protocolVersion: "2026-01-26",
    });
    post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
  }
  const ready = bridge();
  const payload = (result) => result?.structuredContent ?? result?.result?.structuredContent ?? {};
  async function call(name, args) {
    await ready;
    return payload(await request("tools/call", { name, arguments: args }));
  }
  function show(response) {
    if (response?.status !== "pending" || typeof response.nonce !== "string" || !response.nonce) return false;
    if (current && token === null) return false; // Already answered this widget.
    token = response.nonce;
    current = response;
    const browser = current.tool === "browser";
    byId("tool").textContent = browser ? "Playwright 浏览器" : "Computer Use 桌面";
    byId("purpose").textContent = "目的：" + current.purpose;
    byId("risk").textContent = browser
      ? "可能访问已登录网页及浏览器状态。"
      : "可能查看屏幕、窗口和剪贴板，并使用键盘鼠标。";
    buttons.forEach((button) => { button.disabled = busy; });
    status.textContent = "请选择授权范围；关闭面板不会授权。";
    return true;
  }
  async function load() {
    if (show(window.openai?.toolOutput)) return;
    try {
      const response = await call("junius_computer_permission_state", {});
      if (!show(response)) status.textContent = "正在等待当前授权请求的信息；未授予任何权限。";
    } catch (error) {
      status.textContent = "无法读取授权请求：" + String(error.message ?? error);
    }
  }
  async function continueInChat(decision) {
    const prompt = "我已在 Junius 授权面板中选择「" + decision + "」" +
      (current.tool === "browser" ? "Playwright 浏览器" : "Computer Use 桌面") +
      "。请继续刚才的操作，仅执行已说明的目的。";
    if (window.openai?.sendFollowUpMessage) {
      await window.openai.sendFollowUpMessage({ prompt });
    } else {
      await request("ui/message", {
        role: "user",
        content: [{ type: "text", text: prompt }],
      });
    }
  }
  for (const button of buttons) {
    button.addEventListener("click", async () => {
      if (!token || busy) return;
      busy = true;
      buttons.forEach(b => { b.disabled = true; });
      const decision = button.dataset.choice;
      try {
        const result = await call("junius_computer_permission_decide", { nonce: token, decision });
        if (result.ok !== true) throw new Error("授权已过期或无效");
        token = null;
        status.textContent = "已记录：" + decision + "。";
        if (decision.startsWith("允许")) {
          try {
            await continueInChat(decision);
          } catch {
            status.textContent += " 请在聊天中回复「继续」以执行刚才的操作。";
          }
        }
      } catch (error) {
        status.textContent = "授权未生效：" + String(error.message ?? error);
      } finally {
        busy = false;
      }
    });
  }
  void load();
})();
</script>
</body>
</html>
