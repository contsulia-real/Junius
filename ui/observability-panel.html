<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Junius 监控</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --surface: #f7f7f8;
      --surface-2: #efeff0;
      --text: #171717;
      --muted: #74747d;
      --border: rgba(0, 0, 0, 0.11);
      --success: #16794b;
      --danger: #c9362b;
      --running: #9a6700;
      --radius: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171717;
        --surface: #202020;
        --surface-2: #292929;
        --text: #f4f4f4;
        --muted: #a8a8b0;
        --border: rgba(255, 255, 255, 0.12);
        --success: #51b985;
        --danger: #ff7167;
        --running: #e9b949;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 13px;
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(12px);
    }

    .titlebar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-weight: 650;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--muted);
      flex: 0 0 auto;
    }

    .status-dot.online {
      background: var(--success);
    }

    .status-dot.error {
      background: var(--danger);
    }

    .updated {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 0 10px 8px;
    }

    .tab {
      border: 0;
      border-radius: 8px;
      padding: 7px 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .tab[aria-selected="true"] {
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
    }

    .panel {
      display: none;
      padding: 12px;
    }

    .panel.active {
      display: block;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 26px;
      margin-bottom: 8px;
    }

    .panel-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .counter {
      min-width: 22px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .turn-list {
      display: grid;
      gap: 8px;
    }

    details {
      min-width: 0;
    }

    summary {
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .turn-accordion {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .turn-summary {
      min-width: 0;
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 11px 12px;
      cursor: pointer;
      user-select: none;
    }

    .chevron {
      width: 8px;
      height: 8px;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      transform: rotate(-45deg);
      transition: transform 120ms ease;
      justify-self: center;
    }

    details[open] > summary .chevron {
      transform: rotate(45deg);
    }

    .turn-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 620;
    }

    .turn-meta {
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .turn-body {
      border-top: 1px solid var(--border);
      padding: 8px;
    }

    .turn-empty,
    .empty {
      padding: 18px 12px;
      color: var(--muted);
      text-align: center;
    }

    .skill-block {
      margin-bottom: 8px;
    }

    .section-label {
      margin: 2px 2px 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .skill-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;
      font-size: 10px;
    }

    .skill-scope {
      color: var(--muted);
      font-family:
        ui-sans-serif,
        system-ui,
        sans-serif;
    }

    .tool-list {
      display: grid;
      gap: 6px;
    }

    .tool-accordion {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }

    .tool-summary {
      min-width: 0;
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      padding: 9px 10px;
      cursor: pointer;
      user-select: none;
    }

    .tool-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;
      font-size: 11px;
    }

    .tool-count {
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .tool-calls {
      border-top: 1px solid var(--border);
    }

    .call {
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }

    .call:last-child {
      border-bottom: 0;
    }

    .call-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
    }

    .call-index {
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .call-time,
    .call-duration {
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .state {
      font-size: 10px;
      font-weight: 650;
      justify-self: start;
    }

    .state.succeeded {
      color: var(--success);
    }

    .state.failed {
      color: var(--danger);
    }

    .state.running {
      color: var(--running);
    }

    .input {
      margin: 0;
      padding: 8px 9px;
      overflow: auto;
      border-radius: 7px;
      background: var(--surface-2);
      color: var(--text);
      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;
      font-size: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .event-list {
      display: grid;
    }

    .event {
      display: grid;
      grid-template-columns: 62px 8px minmax(0, 1fr);
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }

    .event:last-child {
      border-bottom: 0;
    }

    .event-time {
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .event-dot {
      width: 6px;
      height: 6px;
      margin-top: 4px;
      border-radius: 999px;
      background: var(--muted);
    }

    .event-dot.succeeded {
      background: var(--success);
    }

    .event-dot.failed {
      background: var(--danger);
    }

    .event-dot.started {
      background: var(--running);
    }

    .event-main {
      min-width: 0;
    }

    .event-line {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .event-tool {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;
      font-size: 11px;
    }

    .event-label {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 10px;
    }

    .event-input {
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="titlebar">
        <div class="brand">
          <span id="statusDot" class="status-dot"></span>
          <span>Junius</span>
        </div>
        <span id="updated" class="updated">连接中</span>
      </div>
      <div class="tabs" role="tablist" aria-label="Junius 监控">
        <button class="tab" role="tab" aria-selected="true" data-tab="tools">工具</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="logs">日志</button>
      </div>
    </header>

    <main>
      <section id="toolsPanel" class="panel active" role="tabpanel">
        <div class="panel-head">
          <div class="panel-title">Turns</div>
          <div id="toolTurnCount" class="counter">0</div>
        </div>
        <div id="toolTurns" class="turn-list"></div>
      </section>

      <section id="logsPanel" class="panel" role="tabpanel">
        <div class="panel-head">
          <div class="panel-title">Turns</div>
          <div id="logTurnCount" class="counter">0</div>
        </div>
        <div id="logTurns" class="turn-list"></div>
      </section>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      const SNAPSHOT_TOOL = "junius_observability_snapshot";
      const POLL_MS = 1000;

      let activeTab = "tools";
      let closeRevision = null;
      let pollTimer = null;
      let busy = false;

      let rpcId = 0;
      const pendingRequests = new Map();

      function rpcNotify(method, params) {
        window.parent.postMessage(
          {
            jsonrpc: "2.0",
            method,
            params,
          },
          "*",
        );
      }

      function rpcRequest(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++rpcId;
          const timeout = setTimeout(() => {
            pendingRequests.delete(id);
            reject(
              new Error(
                "mcp_apps_bridge_timeout:" + method,
              ),
            );
          }, 8000);

          pendingRequests.set(
            id,
            {
              resolve(value) {
                clearTimeout(timeout);
                resolve(value);
              },
              reject(error) {
                clearTimeout(timeout);
                reject(error);
              },
            },
          );

          window.parent.postMessage(
            {
              jsonrpc: "2.0",
              id,
              method,
              params,
            },
            "*",
          );
        });
      }

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;

          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;

          if (
            message.method === "ui/resource-teardown" &&
            (typeof message.id === "number" || typeof message.id === "string")
          ) {
            window.parent.postMessage(
              {
                jsonrpc: "2.0",
                id: message.id,
                result: {},
              },
              "*",
            );
            return;
          }

          if (typeof message.id === "number") {
            const pending = pendingRequests.get(message.id);
            if (!pending) return;

            pendingRequests.delete(message.id);
            if (message.error) {
              pending.reject(message.error);
            } else {
              pending.resolve(message.result);
            }
            return;
          }

          if (message.method === "ui/notifications/tool-result") {
            const snapshot = payloadFromToolResult(message.params);
            if (snapshot && typeof snapshot === "object") {
              render(snapshot);
              setConnection("online", "刚刚更新");
            } else {
              void refresh();
            }
          }
        },
        { passive: true },
      );

      async function initializeBridge() {
        await rpcRequest(
          "ui/initialize",
          {
            appInfo: {
              name: "junius-observability",
              version: "2",
            },
            appCapabilities: {},
            protocolVersion: "2026-01-26",
          },
        );

        rpcNotify(
          "ui/notifications/initialized",
          {},
        );
      }

      const bridgeReady = initializeBridge();

      async function callTool(name, args) {
        await bridgeReady;
        return rpcRequest(
          "tools/call",
          {
            name,
            arguments: args,
          },
        );
      }

      const byId = (id) => document.getElementById(id);
      const statusDot = byId("statusDot");
      const updated = byId("updated");

      function text(value) {
        return value == null ? "" : String(value);
      }

      function escapeHtml(value) {
        return text(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function time(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "—";

        return new Intl.DateTimeFormat(
          undefined,
          {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          },
        ).format(date);
      }

      function duration(value) {
        if (!Number.isFinite(value)) return "";
        if (value < 1000) return value + " ms";

        return (value / 1000)
          .toFixed(value < 10000 ? 1 : 0) + " s";
      }

      function pretty(value) {
        try {
          return JSON.stringify(value ?? {}, null, 2);
        } catch {
          return text(value);
        }
      }

      function statusLabel(status) {
        if (status === "succeeded") return "完成";
        if (status === "failed") return "失败";
        if (status === "running") return "运行中";
        return text(status);
      }

      function setConnection(state, label) {
        statusDot.classList.toggle("online", state === "online");
        statusDot.classList.toggle("error", state === "error");
        updated.textContent = label;
      }

      function setTab(tab) {
        activeTab = tab === "logs" ? "logs" : "tools";

        for (const button of document.querySelectorAll(".tab")) {
          button.setAttribute(
            "aria-selected",
            button.dataset.tab === activeTab ? "true" : "false",
          );
        }

        byId("toolsPanel").classList.toggle("active", activeTab === "tools");
        byId("logsPanel").classList.toggle("active", activeTab === "logs");

        try {
          window.openai?.setWidgetState?.({ tab: activeTab });
        } catch {
          // Optional host state.
        }
      }

      function openKeys(container) {
        return new Set(
          [...container.querySelectorAll("details[open][data-key]")]
            .map((detail) => detail.dataset.key)
            .filter(Boolean),
        );
      }

      function openAttr(key, keys) {
        return keys.has(key) ? " open" : "";
      }

      function turnSummary(turn) {
        const meta = [
          turn.status === "active" ? "进行中" : "已结束",
          turn.totalCalls + " 次调用",
          time(turn.startedAt),
        ].join(" · ");

        return (
          '<summary class="turn-summary">' +
            '<span class="chevron"></span>' +
            '<span class="turn-title" title="' +
              escapeHtml(turn.title) + '">' +
              escapeHtml(turn.title) +
            "</span>" +
            '<span class="turn-meta">' + escapeHtml(meta) + "</span>" +
          "</summary>"
        );
      }

      function renderToolTurns(snapshot) {
        const turns = Array.isArray(snapshot.turns) ? snapshot.turns : [];
        const container = byId("toolTurns");
        const opened = openKeys(container);

        byId("toolTurnCount").textContent = String(turns.length);

        if (turns.length === 0) {
          container.innerHTML = '<div class="empty">还没有 Junius turn</div>';
          return;
        }

        container.innerHTML = turns.map((turn) => {
          const turnKey = "tools-turn:" + turn.id;
          const tools = Array.isArray(turn.tools) ? turn.tools : [];
          const skills = Array.isArray(turn.skills) ? turn.skills : [];

          const skillHtml = skills.length === 0
            ? ""
            : '<div class="skill-block">' +
                '<div class="section-label">Skills</div>' +
                '<div class="skill-list">' +
                  skills.map((skill) =>
                    '<span class="skill-chip" title="' +
                      escapeHtml(skill.path || skill.name) + '">' +
                      escapeHtml(skill.name) +
                      (skill.scope
                        ? '<span class="skill-scope">' +
                            escapeHtml(skill.scope) +
                          "</span>"
                        : "") +
                    "</span>"
                  ).join("") +
                "</div>" +
              "</div>";

          const toolHtml = tools.length === 0
            ? '<div class="turn-empty">这一 turn 没有工具调用</div>'
            : '<div class="section-label">Tools</div>' +
              '<div class="tool-list">' + tools.map((tool) => {
                const toolKey = turnKey + ":tool:" + tool.name;
                const calls = Array.isArray(tool.calls) ? tool.calls : [];

                const callHtml = calls.map((call, index) =>
                  '<div class="call">' +
                    '<div class="call-head">' +
                      '<span class="call-index">#' + (index + 1) + "</span>" +
                      '<span class="state ' + escapeHtml(call.status) + '">' +
                        escapeHtml(statusLabel(call.status)) +
                      "</span>" +
                      '<span class="call-time">' + escapeHtml(time(call.startedAt)) + "</span>" +
                      '<span class="call-duration">' + escapeHtml(duration(call.durationMs)) + "</span>" +
                    "</div>" +
                    '<pre class="input">' + escapeHtml(pretty(call.input)) + "</pre>" +
                  "</div>"
                ).join("");

                return (
                  '<details class="tool-accordion" data-key="' + escapeHtml(toolKey) + '"' +
                    openAttr(toolKey, opened) + ">" +
                    '<summary class="tool-summary">' +
                      '<span class="chevron"></span>' +
                      '<span class="tool-name">' + escapeHtml(tool.name) + "</span>" +
                      '<span class="tool-count">× ' + escapeHtml(tool.count) + "</span>" +
                    "</summary>" +
                    '<div class="tool-calls">' + callHtml + "</div>" +
                  "</details>"
                );
              }).join("") + "</div>";

          const body =
            skillHtml +
            toolHtml;

          return (
            '<details class="turn-accordion" data-key="' + escapeHtml(turnKey) + '"' +
              openAttr(turnKey, opened) + ">" +
              turnSummary(turn) +
              '<div class="turn-body">' + body + "</div>" +
            "</details>"
          );
        }).join("");
      }

      function eventLabel(event) {
        if (event.kind === "turn_started") {
          return {
            dot: "started",
            tool: "Turn",
            label: "开始",
          };
        }

        if (event.kind === "turn_completed") {
          return {
            dot: "succeeded",
            tool: "Turn",
            label: "结束",
          };
        }

        if (event.kind === "skill_used") {
          return {
            dot: "succeeded",
            tool: "Skill",
            label: event.skill || "—",
          };
        }

        if (event.kind === "tool_started") {
          return {
            dot: "started",
            tool: event.tool || "—",
            label: "调用开始",
          };
        }

        if (event.kind === "tool_failed") {
          return {
            dot: "failed",
            tool: event.tool || "—",
            label: "调用失败" + (Number.isFinite(event.durationMs)
              ? " · " + duration(event.durationMs)
              : ""),
          };
        }

        return {
          dot: "succeeded",
          tool: event.tool || "—",
          label: "调用完成" + (Number.isFinite(event.durationMs)
            ? " · " + duration(event.durationMs)
            : ""),
        };
      }

      function renderLogTurns(snapshot) {
        const turns = Array.isArray(snapshot.turns) ? snapshot.turns : [];
        const container = byId("logTurns");
        const opened = openKeys(container);

        byId("logTurnCount").textContent = String(turns.length);

        if (turns.length === 0) {
          container.innerHTML = '<div class="empty">还没有 Junius turn</div>';
          return;
        }

        container.innerHTML = turns.map((turn) => {
          const turnKey = "logs-turn:" + turn.id;
          const events = Array.isArray(turn.events) ? turn.events : [];

          const body = events.length === 0
            ? '<div class="turn-empty">这一 turn 没有事件</div>'
            : '<div class="event-list">' + events.map((event) => {
                const view = eventLabel(event);
                const input = event.kind === "tool_started"
                  ? '<pre class="input event-input">' +
                      escapeHtml(pretty(event.input)) +
                    "</pre>"
                  : "";

                return (
                  '<div class="event">' +
                    '<div class="event-time">' + escapeHtml(time(event.at)) + "</div>" +
                    '<span class="event-dot ' + escapeHtml(view.dot) + '"></span>' +
                    '<div class="event-main">' +
                      '<div class="event-line">' +
                        '<span class="event-tool">' + escapeHtml(view.tool) + "</span>" +
                        '<span class="event-label">' + escapeHtml(view.label) + "</span>" +
                      "</div>" +
                      input +
                    "</div>" +
                  "</div>"
                );
              }).join("") + "</div>";

          return (
            '<details class="turn-accordion" data-key="' + escapeHtml(turnKey) + '"' +
              openAttr(turnKey, opened) + ">" +
              turnSummary(turn) +
              '<div class="turn-body">' + body + "</div>" +
            "</details>"
          );
        }).join("");
      }

      function render(snapshot) {
        const nextCloseRevision =
          Number(snapshot.testWindowCloseRevision ?? 0);

        if (closeRevision === null) {
          closeRevision = nextCloseRevision;
        } else if (nextCloseRevision !== closeRevision) {
          closeRevision = nextCloseRevision;

          try {
            void window.openai?.requestClose?.();
          } catch {
            // ChatGPT close support is optional outside the target host.
          }
          return;
        }

        renderToolTurns(snapshot);
        renderLogTurns(snapshot);
      }

      function payloadFromToolResult(result) {
        return result?.structuredContent ??
          result?.result?.structuredContent ??
          result?.content?.structuredContent ??
          null;
      }

      async function refresh() {
        if (busy || document.visibilityState === "hidden") return;

        busy = true;
        try {
          const result = await callTool(SNAPSHOT_TOOL, {});
          const snapshot = payloadFromToolResult(result);

          if (!snapshot || typeof snapshot !== "object") {
            throw new Error("invalid_observability_snapshot");
          }

          render(snapshot);
          setConnection(
            "online",
            snapshot.session?.createdAt
              ? "Session · " + time(snapshot.session.createdAt)
              : "刚刚更新",
          );
        } catch (error) {
          console.error("[Junius panel]", error);
          setConnection("error", "连接失败");
        } finally {
          busy = false;
        }
      }

      function schedule() {
        if (pollTimer !== null) {
          clearInterval(pollTimer);
        }

        pollTimer = setInterval(refresh, POLL_MS);
      }

      for (const button of document.querySelectorAll(".tab")) {
        button.addEventListener("click", () => {
          setTab(button.dataset.tab);
        });
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          void refresh();
        }
      });

      try {
        const storedTab = window.openai?.widgetState?.tab;
        if (storedTab === "logs" || storedTab === "tools") {
          activeTab = storedTab;
        }
      } catch {
        // Optional host state.
      }

      setTab(activeTab);
      schedule();
      void refresh();
    })();
  </script>
</body>
</html>
