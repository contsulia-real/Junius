name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ripgrep
        run: choco install ripgrep -y --no-progress

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Python helper syntax
        run: python -c "import ast, pathlib; [ast.parse(pathlib.Path(p).read_text(encoding='utf-8'), filename=p) for p in ('python/desktop_helper.py', 'python/desktop_indicator.py')]"

      - name: Validate
        run: pnpm run check

      - name: Validate website
        if: matrix.node-version == '24'
        run: pnpm run website:build

      - name: Validate GitHub release distribution
        run: npm run check:release

      - name: Validate GitHub release package
        run: npm run release:build
