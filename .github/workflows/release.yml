name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ripgrep
        run: choco install ripgrep -y --no-progress

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -cne $expected) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $expected."
          }

      - name: Validate
        run: pnpm run check

      - name: Validate GitHub release distribution
        run: npm run check:release

      - name: Build release assets
        run: npm run release:build

      - name: Build release changelog
        run: npm run release:notes

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            "dist/junius-windows.tgz",
            "dist/SHA256SUMS.txt",
            "dist/install.ps1",
            "dist/release.json"
          )
          gh release create "$env:GITHUB_REF_NAME" @assets --draft --verify-tag --title "$env:GITHUB_REF_NAME" --notes-file "dist/release-notes.md"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create draft GitHub Release."
          }

      - name: Install from draft release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseJson = gh release view "$env:GITHUB_REF_NAME" --json databaseId,isDraft,tagName
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read draft GitHub Release for $env:GITHUB_REF_NAME."
          }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.tagName -cne $env:GITHUB_REF_NAME -or $release.isDraft -ne $true) {
            throw "Expected draft release for $env:GITHUB_REF_NAME."
          }
          & .\install.ps1 -ReleaseId ([long]$release.databaseId)

      - name: Verify installed Host
        shell: pwsh
        run: |
          $health = Invoke-RestMethod "http://127.0.0.1:8787/__junius/host-health"
          if ($health.ok -ne $true -or [string]::IsNullOrWhiteSpace($health.activeWorkerId)) {
            throw "Installed Junius Host is not healthy."
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($version.Contains("-")) {
            gh release edit "$env:GITHUB_REF_NAME" --draft=false --prerelease
          } else {
            gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish GitHub Release."
          }

      - name: Remove failed draft release
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $isDraft = gh release view "$env:GITHUB_REF_NAME" --json isDraft --jq ".isDraft" 2>$null
          if ($LASTEXITCODE -eq 0 -and $isDraft -eq "true") {
            gh release delete "$env:GITHUB_REF_NAME" --yes
          }
